---
layout: default
---
<article class="wrap prose">
  <header class="page-head">
    {% if page.section %}<p class="eyebrow">{{ page.section }}</p>{% endif %}
    <h1>{{ page.title }}</h1>
    {% if page.summary %}<p class="lede">{{ page.summary }}</p>{% endif %}
  </header>

  {{ content }}
</article>
